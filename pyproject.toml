[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warband-script-disassembler"
version = "0.1.0"
description = "Disassemble and query Mount & Blade: Warband compiled script bytecode"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
wbsd = "wbsd.wbsd:cli"
wbdis = "wbdis:cli"
wb-build-tables = "wbsd.build_tables:cli"

[tool.setuptools]
py-modules = ["wbasm", "wbdis", "wbops", "wbport", "gen_evidence"]
packages = ["wbsd"]

[tool.setuptools.package-data]
wbsd = ["atlas_schema.json"]
